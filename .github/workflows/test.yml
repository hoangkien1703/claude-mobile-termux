name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install npm package
        # The package intentionally targets Android/ARM64; CI validates it on
        # an Ubuntu runner, so npm's platform gate must be bypassed here.
        run: npm ci --force
      - name: Check shell and Node syntax
        run: npm run check:syntax
      - name: Run ShellCheck
        run: npm run lint:shell
      - name: Run behavioral tests
        run: npm test
      - name: Validate npm package contents
        run: npm run check:package
      - name: Test packaged installation
        run: npm run test:package
